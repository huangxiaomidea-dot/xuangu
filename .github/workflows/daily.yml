name: Daily Screen

on:
  schedule:
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip3 install -i https://mirrors.aliyun.com/pypi/simple/ -r tail-screener/requirements.txt
      - name: 运行尾盘选股
        run: cd tail-screener && python3 scripts/run_screen.py
      - name: 上传选股报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-report-${{ github.run_id }}
          path: tail-screener/notes/
          retention-days: 30
