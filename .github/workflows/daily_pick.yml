name: A股每日选股

on:
  schedule:
    # 北京时间 17:00 = UTC 09:00
    # BaoStock 收盘后约1~2小时数据才完整入库，17:00 运行最稳定
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install baostock pandas numpy

      - name: 运行选股
        id: picker
        run: |
          python picker.py
          TODAY=$(TZ='Asia/Shanghai' date +%Y%m%d)
          if [ -f "output/result_${TODAY}.json" ]; then
            echo "has_result=true" >> $GITHUB_OUTPUT
            echo "今日选股完成，结果文件：output/result_${TODAY}.json"
          else
            echo "has_result=false" >> $GITHUB_OUTPUT
            echo "未生成结果文件，可能是非交易日，跳过后续步骤"
          fi

      - name: 发布到 gh-pages
        if: steps.picker.outputs.has_result == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存当前 output 目录
          cp -r output /tmp/output_new

          git fetch origin gh-pages
          git checkout gh-pages

          # 覆盖 output 目录
          mkdir -p output
          cp -r /tmp/output_new/. output/

          git add output/
          git diff --cached --quiet || git commit -m "自动更新选股数据 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push origin gh-pages
