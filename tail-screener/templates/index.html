<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>14:40 尾盘选股器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --surface2:#1c2128;
  --border:  #30363d;
  --text:    #e6edf3;
  --muted:   #7d8590;
  --green:   #3fb950;
  --red:     #f85149;
  --yellow:  #d29922;
  --blue:    #58a6ff;
  --purple:  #bc8cff;
  --accent:  #1f6feb;
  --radius:  8px;
}
html, body { height: 100%; font-family: -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; }

.app { display: flex; flex-direction: column; height: 100vh; }

header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: 52px; flex-shrink: 0; z-index: 10;
}
header .logo { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
header .meta { color: var(--muted); font-size: 11px; }

/* 桌面三栏 */
.desktop-main {
  display: grid;
  grid-template-columns: 220px 1fr 320px;
  flex: 1;
  overflow: hidden;
}

/* 手机 Tab 导航 */
.mobile-tabs {
  display: none;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1; padding: 10px 0; background: none; border: none;
  color: var(--muted); font-size: 12px; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all .15s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-btn .tab-icon { font-size: 18px; }

/* 手机内容区 */
.mobile-content { display: none; flex: 1; overflow: hidden; }
.mobile-pane { display: none; height: 100%; overflow-y: auto; }
.mobile-pane.active { display: block; }

/* 侧边栏 */
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header { padding: 14px 16px; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
  border-bottom: 1px solid var(--border); }
.report-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.report-item {
  padding: 9px 16px; cursor: pointer; display: flex; align-items: center;
  gap: 10px; color: var(--muted); font-size: 13px; transition: background .15s;
}
.report-item:hover { background: var(--surface2); color: var(--text); }
.report-item.active { background: var(--accent); color: #fff; }
.report-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.report-item.active .dot { background: #fff; }
.report-empty { padding: 24px 16px; color: var(--muted); font-size: 13px; text-align: center; }

/* 中间内容 */
.content { display: flex; flex-direction: column; overflow: hidden; }

.control-bar {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  flex-shrink: 0; flex-wrap: wrap;
}
.btn-run {
  display: flex; align-items: center; gap: 6px;
  background: var(--green); color: #000; border: none; border-radius: var(--radius);
  padding: 9px 20px; font-size: 14px; font-weight: 700; cursor: pointer;
  transition: opacity .15s, transform .1s; white-space: nowrap;
}
.btn-run:hover:not(:disabled) { opacity: .85; }
.btn-run:active:not(:disabled) { transform: scale(.97); }
.btn-run:disabled { opacity: .4; cursor: not-allowed; }
.btn-run.running { background: var(--yellow); }

.status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.status-dot.running { background: var(--yellow); animation: pulse 1s infinite; }
.status-dot.success { background: var(--green); }
.status-dot.error   { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.last-run { margin-left: auto; color: var(--muted); font-size: 11px; }

.result-area { flex: 1; overflow-y: auto; padding: 16px; }

/* 滚动复盘面板 */
.track-panel {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; font-size: 13px;
}
.track-panel.empty { color: var(--muted); font-size: 12px; }
.track-stat { display: flex; flex-direction: column; gap: 2px; }
.track-stat .tv-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.track-stat .tv-value { font-size: 16px; font-weight: 700; }
.track-stat .tv-value.up { color: var(--red); }
.track-stat .tv-value.down { color: var(--green); }
.track-stat .tv-sub { font-size: 10px; margin-top: 1px; }
.track-stat .tv-sub.up { color: var(--red); }
.track-stat .tv-sub.down { color: var(--green); }
.track-recent { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.track-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 12px;
  background: var(--surface2); border: 1px solid var(--border); white-space: nowrap;
}
.track-chip.win  { color: var(--red); }
.track-chip.loss { color: var(--green); }

/* 20日历史回测面板 */
.track-panel.backtest { background: var(--surface2); border-bottom: 1px solid var(--border); }
.btn-backtest {
  font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  background: var(--accent); color: #fff; border: none; white-space: nowrap;
}
.btn-backtest:disabled { opacity: .5; cursor: not-allowed; }
.backtest-meta { font-size: 11px; color: var(--muted); }

/* 报告标题 */
.report-date { font-size: 18px; font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.report-date .badge { font-size: 11px; font-weight: 500; padding: 2px 8px;
  border-radius: 20px; background: var(--surface2); color: var(--muted); }

.section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::after { content:""; flex:1; height:1px; background:var(--border); }

/* TOP3 卡片 */
.top3-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }

.stock-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; position: relative;
  transition: border-color .2s, transform .2s;
}
.stock-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.stock-card.rank-1 { border-top: 3px solid var(--yellow); }
.stock-card.rank-2 { border-top: 3px solid #aaa; }
.stock-card.rank-3 { border-top: 3px solid #cd7f32; }
.card-rank { position: absolute; top: 10px; right: 10px; font-size: 18px; }
.card-code { font-size: 11px; color: var(--muted); margin-bottom: 1px; }
.card-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; padding-right: 28px; }
.card-price { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
.card-pct { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.card-pct.up { color: var(--red); }
.card-pct.down { color: var(--green); }
.card-stats { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 1px; }
.stat-value { font-size: 13px; font-weight: 600; }
.score-bar { margin-top: 10px; }
.score-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.score-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--purple)); transition: width .6s ease; }
.factors-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.factor-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: var(--surface2); color: var(--blue); border: 1px solid var(--border); }

/* TOP10 表格 */
.table-wrap { overflow-x: auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius); -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--surface2); }
th { padding: 9px 12px; text-align: left; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .3px; color: var(--muted);
  border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface2); }
.rank-num { font-weight: 700; color: var(--muted); }
.pct-up   { color: var(--red); font-weight: 600; }
.pct-down { color: var(--green); font-weight: 600; }

/* 空状态 */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 240px; color: var(--muted); gap: 10px; }
.empty-icon { font-size: 44px; opacity: .4; }
.empty-text { font-size: 13px; text-align: center; padding: 0 16px; }

/* 日志面板 */
.log-panel {
  background: #0a0c0f; border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.log-header {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.btn-clear { font-size: 11px; color: var(--muted); background: none; border: none;
  cursor: pointer; padding: 2px 8px; border-radius: 4px; }
.btn-clear:hover { background: var(--surface); color: var(--text); }
.log-body { flex: 1; overflow-y: auto; padding: 10px 14px;
  font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 12px;
  line-height: 1.7; color: #8b949e; }
.log-line { white-space: pre-wrap; word-break: break-all; }
.log-line.info { color: #8b949e; }
.log-line.ok   { color: var(--green); }
.log-line.warn { color: var(--yellow); }
.log-line.err  { color: var(--red); }
.log-line.head { color: var(--blue); font-weight: bold; }
.log-line.web  { color: var(--purple); }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── 响应式 ── */
@media (max-width: 768px) {
  .desktop-main { display: none; }
  .mobile-tabs { display: flex; }
  .mobile-content { display: flex; flex-direction: column; }

  .top3-grid { grid-template-columns: 1fr; }

  /* 手机日志面板样式 */
  .mobile-log {
    display: flex; flex-direction: column; height: 100%;
    background: #0a0c0f;
  }
  .mobile-log .log-header {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .mobile-log .log-body { flex: 1; overflow-y: auto; padding: 10px 14px;
    font-family: monospace; font-size: 12px; line-height: 1.7; color: #8b949e; }
}

@media (min-width: 769px) {
  .mobile-tabs, .mobile-content { display: none !important; }
  .desktop-main { display: grid; flex: 1; }
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">📈 尾盘选股器</div>
  <div class="meta" id="meta-time"></div>
</header>

<!-- 手机 Tab -->
<div class="mobile-tabs">
  <button class="tab-btn active" onclick="switchTab('result')" id="tab-result">
    <span class="tab-icon">📊</span><span>结果</span>
  </button>
  <button class="tab-btn" onclick="switchTab('history')" id="tab-history">
    <span class="tab-icon">📁</span><span>历史</span>
  </button>
  <button class="tab-btn" onclick="switchTab('log')" id="tab-log">
    <span class="tab-icon">🖥</span><span>日志</span>
  </button>
</div>

<!-- 手机内容区 -->
<div class="mobile-content">
  <!-- 结果页 -->
  <div class="mobile-pane active" id="mpane-result">
    <div class="control-bar">
      <button class="btn-run" id="btn-run-m" onclick="runScreener()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="btn-text-m">立即选股</span>
      </button>
      <div class="status-badge">
        <div class="status-dot" id="status-dot-m"></div>
        <span id="status-text-m">空闲</span>
      </div>
      <div class="last-run" id="last-run-m"></div>
    </div>
    <div id="track-panel-m" class="track-panel"></div>
    <div id="backtest-panel-m" class="track-panel backtest"></div>
    <div style="padding:16px" id="result-area-m">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">点击「立即选股」开始，或在「历史」中查看往期报告</div>
      </div>
    </div>
  </div>

  <!-- 历史页 -->
  <div class="mobile-pane" id="mpane-history">
    <div class="sidebar-header" style="padding:14px 16px">历史报告</div>
    <div id="report-list-m" class="report-list">
      <div class="report-empty">暂无报告</div>
    </div>
  </div>

  <!-- 日志页 -->
  <div class="mobile-pane" id="mpane-log">
    <div class="mobile-log">
      <div class="log-header">
        <span>运行日志</span>
        <button class="btn-clear" onclick="clearLog()">清空</button>
      </div>
      <div class="log-body" id="log-body-m"></div>
    </div>
  </div>
</div>

<!-- 桌面三栏 -->
<div class="desktop-main">
  <aside class="sidebar">
    <div class="sidebar-header">历史报告</div>
    <div class="report-list" id="report-list"></div>
  </aside>

  <section class="content">
    <div class="control-bar">
      <button class="btn-run" id="btn-run" onclick="runScreener()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="btn-text">立即选股</span>
      </button>
      <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">空闲</span>
      </div>
      <div class="last-run" id="last-run-time"></div>
    </div>
    <div id="track-panel" class="track-panel"></div>
    <div id="backtest-panel" class="track-panel backtest"></div>
    <div class="result-area" id="result-area">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">点击「立即选股」开始运行，或从左侧选择历史报告</div>
      </div>
    </div>
  </section>

  <aside class="log-panel">
    <div class="log-header">
      <span>运行日志</span>
      <button class="btn-clear" onclick="clearLog()">清空</button>
    </div>
    <div class="log-body" id="log-body"></div>
  </aside>
</div>

</div><!-- .app -->

<script>
let currentReport = null;
let evtSource = null;

function isMobile() { return window.innerWidth <= 768; }

// Tab 切换
function switchTab(name) {
  ['result','history','log'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('mpane-'+t).classList.toggle('active', t===name);
  });
}

function fmtPct(v) {
  const n = parseFloat(v);
  return isNaN(n) ? v : (n>=0?'+':'')+n.toFixed(2)+'%';
}
function pctClass(v) { return parseFloat(v)>=0 ? 'pct-up' : 'pct-down'; }
function pctCardClass(v) { return parseFloat(v)>=0 ? 'up' : 'down'; }

// 日志
function logClass(line) {
  if (line.startsWith('[web]'))        return 'web';
  if (/✅|完成|成功/.test(line))       return 'ok';
  if (/⚠️|警告/.test(line))           return 'warn';
  if (/❌|失败|异常|错误/.test(line))  return 'err';
  if (/===/.test(line))                return 'head';
  return 'info';
}
function appendLog(text) {
  ['log-body','log-body-m'].forEach(id => {
    const box = document.getElementById(id);
    if (!box) return;
    const div = document.createElement('div');
    div.className = 'log-line ' + logClass(text);
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });
}
function clearLog() {
  ['log-body','log-body-m'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
}

// 渲染报告
function renderReport(data, targetId) {
  const area = document.getElementById(targetId);
  if (!area) return;
  if (!data || (!data.top3?.length && !data.top10?.length)) {
    area.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>
      <div class="empty-text">${data?.date||''} 无满足条件的标的</div></div>`;
    return;
  }
  const rankLabel = ['','🥇','🥈','🥉'];
  let cards = '';
  (data.top3||[]).forEach(s => {
    const score = parseFloat(s.score)||0;
    const tags = (s.factors||'').split('、').filter(Boolean)
      .map(f=>`<span class="factor-tag">${f}</span>`).join('');
    cards += `<div class="stock-card rank-${s.rank}">
      <div class="card-rank">${rankLabel[s.rank]||'#'+s.rank}</div>
      <div class="card-code">${s.code}</div>
      <div class="card-name">${s.name}</div>
      <div class="card-price">¥${s.price}</div>
      <div class="card-pct ${pctCardClass(s.pct)}">${fmtPct(s.pct)}</div>
      <div class="card-stats">
        <div class="stat"><div class="stat-label">振幅</div><div class="stat-value">${parseFloat(s.amp).toFixed(2)}%</div></div>
      </div>
      <div class="score-bar">
        <div class="score-label"><span>概率分</span><span>${score.toFixed(1)}</span></div>
        <div class="score-track"><div class="score-fill" style="width:${score}%"></div></div>
      </div>
      <div class="factors-tags">${tags}</div>
    </div>`;
  });
  let rows = '';
  (data.top10||[]).forEach(s => {
    rows += `<tr>
      <td class="rank-num">${s.rank}</td><td>${s.code}</td><td>${s.name}</td>
      <td class="${pctClass(s.pct)}">${fmtPct(s.pct)}</td>
      <td>${parseFloat(s.vol_ratio||0).toFixed(2)}</td>
      <td>${parseFloat(s.turnover||0).toFixed(2)}%</td>
      <td>${parseFloat(s.amp||0).toFixed(2)}%</td>
      <td><strong>${parseFloat(s.score||0).toFixed(1)}</strong></td>
    </tr>`;
  });
  area.innerHTML = `
    <div class="report-date">${data.display_time||data.date}
      <span class="badge">共 ${data.top10?.length||0} 只候选</span></div>
    <div class="section-title">TOP 3 推荐</div>
    <div class="top3-grid">${cards||'<p style="color:var(--muted)">无数据</p>'}</div>
    <div class="section-title">TOP 10 榜单</div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>排名</th><th>代码</th><th>名称</th>
        <th>涨幅</th><th>量比</th><th>换手%</th><th>振幅%</th><th>概率分</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">无数据</td></tr>'}</tbody>
    </table></div>`;
}

function renderBothReports(data) {
  renderReport(data, 'result-area');
  renderReport(data, 'result-area-m');
}

// 报告列表
function fmtRunId(runId) {
  // run_id 格式：YYYY-MM-DD_HHMMSS（新版）或 YYYY-MM-DD（旧版兼容）
  if (runId.includes('_')) {
    const [datePart, timePart] = runId.split('_');
    return `${datePart} ${timePart.slice(0,2)}:${timePart.slice(2,4)}`;
  }
  return runId;
}

function renderReportList(reports) {
  ['report-list','report-list-m'].forEach(id => {
    const list = document.getElementById(id);
    if (!list) return;
    if (!reports?.length) { list.innerHTML = '<div class="report-empty">暂无报告</div>'; return; }
    list.innerHTML = reports.map(d=>`
      <div class="report-item ${d===currentReport?'active':''}" data-run-id="${d}" onclick="loadReport('${d}')">
        <div class="dot"></div><span>${fmtRunId(d)}</span>
      </div>`).join('');
  });
}

function loadReport(date) {
  currentReport = date;
  fetch(`/api/report/${date}`).then(r=>r.json()).then(j=>{
    if (j.ok) {
      renderBothReports(j.data);
      if (isMobile()) switchTab('result');
    }
  });
  document.querySelectorAll('.report-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.runId===date);
  });
}

// 状态更新
function updateStatus(s) {
  [['status-dot','status-text','btn-run','btn-text','last-run-time'],
   ['status-dot-m','status-text-m','btn-run-m','btn-text-m','last-run-m']
  ].forEach(([dotId,txtId,btnId,btnTxtId,lastId])=>{
    const dot=document.getElementById(dotId);
    const txt=document.getElementById(txtId);
    const btn=document.getElementById(btnId);
    const btnTxt=document.getElementById(btnTxtId);
    const last=document.getElementById(lastId);
    if (!dot) return;
    dot.className='status-dot '+(s.running?'running':s.last_status);
    txt.textContent=s.running?'运行中...':({idle:'空闲',success:'已完成',error:'运行出错'}[s.last_status]||s.last_status);
    btn.disabled=s.running;
    btn.className='btn-run'+(s.running?' running':'');
    btnTxt.textContent=s.running?'运行中...':'立即选股';
    if(last) last.textContent=s.last_run?`上次：${s.last_run}`:'';
  });
  renderReportList(s.reports);
}

function pollStatus() {
  fetch('/api/status').then(r=>r.json()).then(s=>{
    updateStatus(s);
    const t=new Date().toLocaleTimeString('zh-CN');
    document.getElementById('meta-time').textContent=t;
  }).catch(()=>{});
}

// 滚动复盘面板（TOP3整体 + 首选，两个成功率）
function renderTrackPanel(statsTop3, statsTop1, recent) {
  let html;
  if ((!statsTop3 || statsTop3.total === 0) && (!statsTop1 || statsTop1.total === 0)) {
    html = '<span>📊 滚动复盘：暂无历史结算数据（次日9:30-9:40开盘窗口结算）</span>';
  } else {
    const mkStat = (label, s) => {
      if (!s || s.total === 0) {
        return `<div class="track-stat"><span class="tv-label">${label}</span><span class="tv-value">--</span></div>`;
      }
      const cls = s.win_rate >= 55 ? 'up' : 'down';
      const arClass = s.avg_return >= 0 ? 'up' : 'down';
      const arText = s.avg_return != null ? `${s.avg_return>=0?'+':''}${s.avg_return}%` : '--';
      return `<div class="track-stat">
        <span class="tv-label">${label}（${s.wins}/${s.total}）</span>
        <span class="tv-value ${cls}">${s.win_rate}%</span>
        <span class="tv-sub ${arClass}">均收益 ${arText}</span>
      </div>`;
    };
    html = mkStat('TOP3成功率', statsTop3) + mkStat('首选成功率', statsTop1) +
      `<div class="track-recent">${(recent||[]).slice(0,6).map(r=>
        `<span class="track-chip ${r.win?'win':'loss'}">${r.win?'✅':'❌'}${r.rank===1?'【首选】':''} ${r.name} ${r.return_pct>=0?'+':''}${r.return_pct}%</span>`
      ).join('')}</div>`;
  }
  ['track-panel','track-panel-m'].forEach(id=>{
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  });
}

function pollTrack() {
  fetch('/api/track').then(r=>r.json()).then(j=>{
    if (j.ok) renderTrackPanel(j.stats_top3, j.stats_top1, j.recent);
  }).catch(()=>{});
}

// 20日历史回测面板
function runAlgoBacktest() {
  fetch('/api/algo-backtest/run', {method:'POST'}).then(r=>r.json()).then(j=>{
    pollBacktest();
  });
}

function renderBacktestPanel(state, data) {
  let html;
  if (state && state.running) {
    html = '<span>⏳ 全市场20日回测运行中，覆盖5000+只股票，预计需要30-60分钟，可关闭页面稍后回来查看...</span>';
  } else if (!data) {
    html = `
      <span class="backtest-meta">📈 全市场20日历史回测：尚未运行</span>
      <button class="btn-backtest" onclick="runAlgoBacktest()">运行回测</button>`;
  } else {
    const mkStat = (label, s) => {
      if (!s || s.total === 0) {
        return `<div class="track-stat"><span class="tv-label">${label}</span><span class="tv-value">--</span></div>`;
      }
      const cls = s.win_rate >= 55 ? 'up' : 'down';
      const arClass = s.avg_return >= 0 ? 'up' : 'down';
      const arText = s.avg_return != null ? `${s.avg_return>=0?'+':''}${s.avg_return}%` : '--';
      return `<div class="track-stat">
        <span class="tv-label">${label}（${s.wins}/${s.total}）</span>
        <span class="tv-value ${cls}">${s.win_rate}%</span>
        <span class="tv-sub ${arClass}">均收益 ${arText}</span>
      </div>`;
    };
    html = `<span class="backtest-meta">📈 近${data.lookback_days}日回测（${data.generated_at}，样本${data.sample_stocks}只）</span>` +
      mkStat('TOP3成功率', data.top3_stats) + mkStat('首选成功率', data.top1_stats) +
      `<button class="btn-backtest" onclick="runAlgoBacktest()" style="margin-left:auto">重新回测</button>`;
  }
  ['backtest-panel','backtest-panel-m'].forEach(id=>{
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  });
}

let _backtestPolling = false;
function pollBacktest() {
  fetch('/api/algo-backtest').then(r=>r.json()).then(j=>{
    if (!j.ok) return;
    renderBacktestPanel(j.state, j.data);
    if (j.state && j.state.running && !_backtestPolling) {
      _backtestPolling = true;
      const timer = setInterval(() => {
        fetch('/api/algo-backtest').then(r=>r.json()).then(jj=>{
          renderBacktestPanel(jj.state, jj.data);
          if (!jj.state.running) { clearInterval(timer); _backtestPolling = false; }
        });
      }, 8000);
    }
  }).catch(()=>{});
}

// SSE 日志
function subscribeLog() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/logs/stream');
  evtSource.onmessage = e => {
    const line = JSON.parse(e.data);
    if (line === '__DONE__') {
      appendLog('[web] ─── 运行结束 ───');
      evtSource.close(); evtSource = null;
      setTimeout(()=>{
        fetch('/api/report/latest').then(r=>r.json()).then(j=>{
          if(j.ok){ currentReport=j.data.date; renderBothReports(j.data); }
        });
        pollStatus();
        pollTrack();
      }, 800);
    } else {
      appendLog(line);
    }
  };
  evtSource.onerror = ()=>{ if(evtSource){evtSource.close();evtSource=null;} };
}

function runScreener() {
  clearLog();
  appendLog('[web] 正在启动选股...');
  if (isMobile()) switchTab('log');
  fetch('/api/run',{method:'POST'}).then(r=>r.json()).then(j=>{
    if(j.ok){ appendLog('[web] 选股已启动，等待输出...'); subscribeLog(); pollStatus(); }
    else { appendLog(`[web] ⚠️ ${j.msg}`); }
  }).catch(e=>appendLog(`[web] ❌ 请求失败：${e}`));
}

(function init(){
  pollStatus();
  pollTrack();
  pollBacktest();
  setInterval(pollStatus, 5000);
  setInterval(pollTrack, 30000);
  setInterval(()=>{
    document.getElementById('meta-time').textContent=new Date().toLocaleTimeString('zh-CN');
  },1000);
  fetch('/api/status').then(r=>r.json()).then(s=>{
    updateStatus(s);
    if(s.running) subscribeLog();
    if(s.reports?.length) loadReport(s.reports[0]);
  });
})();
</script>
